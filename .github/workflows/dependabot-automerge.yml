name: Dependabot Auto Merge

on:
  # 2026-05-16 Round 9 WARN FIX (CI workflows agent): removed `synchronize`
  # and `ready_for_review` from triggers. `gh pr merge --auto --squash`
  # only needs to fire once per PR (on opened/reopened); re-firing on every
  # commit-push to a dependabot branch is unnecessary attack surface for a
  # `pull_request_target` workflow that carries repo-secret access.
  pull_request_target:
    types:
      - opened
      - reopened

# 2026-05-15 (Audit-Round-4 / Agent #11 HIGH): `contents: write` was wider
# than necessary — `gh pr merge --auto --squash` only needs `pull-requests:
# write`; the actual merge happens through the GitHub-side auto-merge engine
# under the bot's token, not via a direct git push from this workflow. With
# `pull_request_target` carrying repo-secret access on `synchronize`, a
# compromised dependabot branch (or a manipulated metadata-action) would
# otherwise inherit branch-write rights.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependabot-automerge:
    # Phase 48 (R45-CFG-2): pull_request_target gives the workflow access to
    # repo secrets even on PRs from forks. Restrict to PRs originating from
    # THIS repository to defeat any "spoof the bot name" supply-chain attack.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Phase 93 (R51-S9): SHA-pinned third-party action (was @v3 floating).
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-approve patch/minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # 2026-05-15 (Audit-Round-7 / Agent #34 HIGH): output-injection
        # hardening. `${{ ... }}` interpolation of an action output into a
        # shell `run` string is a known supply-chain risk if the action's
        # output ever becomes attacker-controllable (today the action is
        # SHA-pinned + first-party, but future tag-floats would re-open the
        # gap). Move the value into an env-var and use parameter expansion
        # so the shell never interprets the contents.
        run: gh pr review --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --approve -b "Auto-approving Dependabot $UPDATE_TYPE."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}

      # Round 54: defense-in-depth — wait for ALL CI checks to finish and
      # require all to pass before enabling auto-merge. Branch protection is
      # the primary gate; this step adds a second one in case the protection
      # rules drift or are accidentally relaxed. `--watch --fail-fast` exits
      # non-zero the moment any check fails, blocking the merge step.
      - name: Wait for CI checks to pass
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr checks --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --watch --fail-fast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Enable auto-merge for patch/minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
